[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --cov=src
    --cov-report=term-missing
    --cov-report=xml
    --cov-report=html
    -v
    -W ignore::DeprecationWarning
env =
    APP_ENV=testing
    MONGODB_URI=mongodb://localhost:27017/test_db
    REDIS_URI=redis://localhost:6379/1
    OPENAI_API_KEY=test-key
